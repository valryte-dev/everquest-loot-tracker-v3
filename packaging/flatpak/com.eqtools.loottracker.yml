id: com.eqtools.loottracker
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: everquest-loot-tracker
appstream-compose: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: everquest-loot-tracker
    buildsystem: simple
    build-commands:
      - ar x everquest-loot-tracker.deb
      - mkdir deb-extract
      - tar -xf data.tar.* -C deb-extract
      - install -Dm755 deb-extract/usr/bin/everquest-loot-tracker /app/bin/everquest-loot-tracker
      - install -Dm644 com.eqtools.loottracker.desktop /app/share/applications/com.eqtools.loottracker.desktop
      - install -Dm644 com.eqtools.loottracker.metainfo.xml /app/share/metainfo/com.eqtools.loottracker.metainfo.xml
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.eqtools.loottracker.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.eqtools.loottracker.png
    sources:
      - type: file
        path: everquest-loot-tracker.deb
      - type: file
        path: com.eqtools.loottracker.desktop
      - type: file
        path: com.eqtools.loottracker.metainfo.xml
      - type: file
        path: ../../src-tauri/icons/128x128.png
        dest-filename: icon-128.png
      - type: file
        path: ../../src-tauri/icons/128x128@2x.png
        dest-filename: icon-256.png
