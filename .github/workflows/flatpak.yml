name: Flatpak

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf
      - run: npm ci
      - name: Build Debian package
        run: npm run tauri build -- --bundles deb
      - name: Build Flatpak bundle
        run: bash packaging/flatpak/build-flatpak.sh
      - uses: actions/upload-artifact@v6
        with:
          name: everquest-loot-tracker-flatpak-x86_64
          path: EverQuest-Loot-Tracker-*-x86_64.flatpak
          if-no-files-found: error
