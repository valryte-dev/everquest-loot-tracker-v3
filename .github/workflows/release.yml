name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: EverQuest Loot Tracker ${{ github.ref_name }}
          releaseBody: Cross-platform desktop release generated by GitHub Actions.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  flatpak:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf
      - run: npm ci
      - name: Build Debian package
        run: npm run tauri build -- --bundles deb
      - name: Build Flatpak bundle
        run: bash packaging/flatpak/build-flatpak.sh
      - uses: actions/upload-artifact@v6
        with:
          name: everquest-loot-tracker-flatpak-x86_64
          path: EverQuest-Loot-Tracker-*-x86_64.flatpak
          if-no-files-found: error
      - name: Attach Flatpak to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" EverQuest-Loot-Tracker-*-x86_64.flatpak --clobber
